<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1500" viewBox="0 0 2600 1500">
  <title>Big Cannon — White Silhouette</title>
  <desc>Large cannon silhouette with one big wheel and long barrel. Transparent background, solid white.</desc>

  <g fill="#FFFFFF" stroke="none" transform="translate(260,930)">
    <!-- BIG WHEEL (solid) -->
    <circle cx="0" cy="0" r="300"/>
    <!-- HUB cutout via evenodd rule -->
    <path d="M 0,0 m -40,0 a 40,40 0 1,0 80,0 a 40,40 0 1,0 -80,0"
          fill-rule="evenodd" fill="#00000000"/>

    <!-- LONG BARREL -->
    <path d="M 40,-80 L 1280,-80 Q 1310,-80 1324,-66 L 1324,66 Q 1310,80 1280,80 L 40,80 Z"/>
    <!-- Muzzle disc -->
    <ellipse cx="1324" cy="0" rx="34" ry="22"/>

    <!-- CARRIAGE/TRAIL -->
    <path d="M 60,80 L 520,200 L 740,200 L 240,80 Z"/>
    <path d="M 240,80 L -320,200 L -300,224 L 260,96 Z"/>
    <circle cx="-320" cy="200" r="28"/>
  </g>
</svg>
