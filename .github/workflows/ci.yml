name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_API_BASE_URL: ${{ secrets.RELEASE_API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run backend unit tests
        run: npm --prefix backend test

      - name: Audit production backend dependencies
        run: npm --prefix backend audit --omit=dev --audit-level=high

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify referenced assets
        run: bash tools/verify_assets.sh

      - name: Reject client/backend economy catalog drift
        run: bash tools/verify_economy_catalog.sh

      - name: Run Firestore rules and backend emulator tests
        run: bash tools/verify_firestore_rules.sh

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Enforce cross-device game layout parity
        run: bash tools/verify_game_layout.sh

      - name: Compile exact backend-authoritative web release
        run: >
          flutter build web
          --release
          --base-href /web/
          --no-wasm-dry-run
          --dart-define=API_BASE_URL=https://ci-backend.invalid
          --dart-define=ALLOW_LOCAL_ECONOMY_DEV=false

      - name: Compile unsigned backend-authoritative public AAB
        run: >
          flutter build appbundle
          --release
          -t lib/main_public.dart
          --dart-define=API_BASE_URL=https://ci-backend.invalid
          --dart-define=ALLOW_LOCAL_ECONOMY_DEV=false

      - name: Smoke live release backend when configured
        if: ${{ env.RELEASE_API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ env.RELEASE_API_BASE_URL }}
        run: node tools/smoke_backend_live.mjs --health-only

  ios-compile:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Apple release toolchain
        shell: bash
        run: |
          xcodebuild -version
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK ${ios_sdk_version}"
          ios_sdk_major="${ios_sdk_version%%.*}"
          if (( ios_sdk_major < 26 )); then
            echo "iOS release builds require the iOS 26 SDK or newer." >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify locked iOS pods
        run: pod install --project-directory=ios --deployment

      - name: Compile unsigned backend-authoritative iOS release
        run: >
          flutter build ios
          --release
          --no-codesign
          -t lib/main_public.dart
          --dart-define=API_BASE_URL=https://ci-backend.invalid
          --dart-define=ALLOW_LOCAL_ECONOMY_DEV=false
