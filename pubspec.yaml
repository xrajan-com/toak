name: ten_of_a_kind_poker
description: A Flutter app for Ten Of A Kind poker tournament
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  
dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  intl: ^0.19.0
  timezone: ^0.9.2

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.4

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Profile image picker
  image_picker: ^1.0.7
  flutter_svg: ^2.0.7

  # State management
  provider: ^6.1.2

  # Environment variables
  flutter_dotenv: ^5.1.0
  http: ^1.2.1
  just_audio: ^0.9.38
  url_launcher: ^6.3.0

  # Icons / cards
  cupertino_icons: ^1.0.6
  playing_cards: ^0.4.1+11
  pdf: ^3.11.3
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Main images
    - assets/images/
    - assets/images/flags/
    - assets/images/flags/indian/
    - assets/images/flags/international/
    - assets/images/cards/
    - assets/images/watermarks/
    - assets/images/watermarks/Africa/
    - assets/images/watermarks/Arabia/
    - assets/images/watermarks/Asia/
    - assets/images/watermarks/Australia/
    - assets/images/watermarks/Baroda/
    - assets/images/watermarks/China/
    - assets/images/watermarks/Europe/
    - assets/images/watermarks/Hyderabad/
    - assets/images/watermarks/India/
    - assets/images/watermarks/Indore/
    - assets/images/watermarks/Jaipur/
    - assets/images/watermarks/Maratha Empire/
    - assets/images/watermarks/Mysore/
    - assets/images/watermarks/N. America/
    - assets/images/watermarks/New Delhi/
    - assets/images/watermarks/Russia/
    - assets/images/watermarks/S. America/
    - assets/images/watermarks/Sikh Empire/
    - assets/images/watermarks/Sikkim/
    - assets/images/watermarks/Travancore/
    - assets/images/avatars/bots/
    - assets/sounds/

    # Explicit single assets
    - assets/images/default_profile.png

    # Card backs (randomly selected each game)
    # Included via `- assets/images/cards/` above (see: tools/generate_card_backs.py)

    # Legacy/fallback
    - assets/images/card_back.png

    # Env file
    - .env

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Light.ttf
    - family: PokerFont
      fonts:
        - asset: assets/fonts/PokerFont-Regular.ttf
