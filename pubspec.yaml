name: ten_of_a_kind_poker
description: X Poker, an offline Texas Hold'em game
publish_to: 'none'

version: 1.2.10+85

environment:
  sdk: '>=3.3.0 <4.0.0'
  
dependencies:
  flutter:
    sdk: flutter

  # Core utilities
  intl: ^0.19.0
  timezone: ^0.9.2

  # Firebase
  firebase_core: 2.32.0
  firebase_auth: 4.20.0
  cloud_firestore: 4.17.5

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Profile image picker
  image_picker: 1.1.2
  flutter_svg: ^2.0.7

  # State management
  provider: ^6.1.2

  # Environment variables
  flutter_dotenv: ^5.1.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  just_audio: ^0.9.38
  url_launcher: ^6.3.0

  # Icons / cards
  cupertino_icons: ^1.0.6
  playing_cards: ^0.4.1+11

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.7
  flutter_lints: ^4.0.0

dependency_overrides:
  image_picker_android: 0.8.12+24
  shared_preferences_android: 2.4.17
  url_launcher_android: 6.3.16
  webview_flutter_android: 4.9.0

flutter:
  uses-material-design: true

  assets:
