<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!-- Base href is replaced at build time. Pass --base-href /web/ when building for hosting under /web/. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Play X Poker by Ten of a Kind, a free recreational poker simulation for practicing Texas Hold'em strategy and decision-making.">
  <meta name="author" content="Kapil Poonia">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ten of a Kind Poker">
  <meta property="og:title" content="Play X Poker | Ten of a Kind">
  <meta property="og:description" content="Play the official browser version of X Poker by Ten of a Kind.">
  <meta property="og:url" content="https://tenofakind.com/web/">
  <meta property="og:image" content="https://tenofakind.com/Logo.png">
  <meta name="theme-color" content="#7a0000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ten of a Kind">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico?v=20260705" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=20260705"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=20260705"/>

  <title>Play X Poker | Ten of a Kind</title>
  <link rel="canonical" href="https://tenofakind.com/web/">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
    }

    body {
      overflow: hidden;
      color: #f5f2e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #bootstrap-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(178, 34, 34, 0.2), transparent 44%),
        linear-gradient(180deg, #101010 0%, #050505 100%);
      transition: opacity 220ms ease;
      z-index: 9999;
    }

    #bootstrap-loader.bootstrap-loader--hidden {
      opacity: 0;
      pointer-events: none;
    }

    .bootstrap-loader__panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
    }

    .bootstrap-loader__logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .bootstrap-loader__title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .bootstrap-loader__status {
      max-width: 280px;
      color: rgba(245, 242, 232, 0.72);
      font-size: 14px;
      line-height: 1.5;
    }

    .bootstrap-loader__spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(245, 242, 232, 0.18);
      border-top-color: #f5f2e8;
      border-radius: 50%;
      animation: bootstrap-spin 0.9s linear infinite;
    }

    @keyframes bootstrap-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="bootstrap-loader" aria-live="polite">
    <div class="bootstrap-loader__panel">
      <img
        class="bootstrap-loader__logo"
        src="icons/Icon-192.png"
        alt="Ten of a Kind"
      >
      <div class="bootstrap-loader__spinner" aria-hidden="true"></div>
      <div class="bootstrap-loader__title">Ten of a Kind</div>
      <div id="bootstrap-status" class="bootstrap-loader__status">
        Loading table...
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
